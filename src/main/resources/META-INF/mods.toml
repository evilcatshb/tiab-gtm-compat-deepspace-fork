modLoader="kotlinforforge"
loaderVersion="${kff_version_range}"
license="${mod_license}"

[[mixins]]
config="tiab_gtm_compat.mixins.json"

[[mods]]
modId="${mod_id}"
displayName="${mod_name}"
version="${mod_version}"
authors="${mod_authors}"
description='''${mod_description}'''
credits="${mod_credits}"
logoFile="logo.png"

[[dependencies."${mod_id}"]]
modId="kotlinforforge"
versionRange="${kff_version_range}"
mandatory=true
side="BOTH"
ordering="NONE"

[[dependencies."${mod_id}"]]
modId="minecraft"
versionRange="${minecraft_version_range}"
mandatory=true
side="BOTH"
ordering="NONE"

[[dependencies."${mod_id}"]]
modId="forge"
versionRange="${forge_version_range}"
mandatory=true
side="BOTH"
ordering="NONE"

[[dependencies."${mod_id}"]]
modId="gtceu"
mandatory=true
versionRange="${gtceu_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="tiab"
mandatory=true
versionRange="${tiab_version_range}"
ordering="AFTER"
side="BOTH"
